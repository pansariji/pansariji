name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download both themes
        env:
          HANDLE: pansariji
          GH_ASCII_URL: https://gh.crafter.run
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=dark" \
            -o dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=light" \
            -o light_mode.svg
          
          # Override languages with custom list
          sed -i -E 's/(Languages: <\/tspan><tspan[^>]*>[^<]*<\/tspan><tspan[^>]*> )[^<]+(<\/tspan>)/\1Java, Flutter, Dart, Rust, C++, Python\2/' dark_mode.svg
          sed -i -E 's/(Languages: <\/tspan><tspan[^>]*>[^<]*<\/tspan><tspan[^>]*> )[^<]+(<\/tspan>)/\1Java, Flutter, Dart, Rust, C++, Python\2/' light_mode.svg
          
          # Override top repo
          sed -i -E 's/(Top repo: <\/tspan><tspan[^>]*>[^<]*<\/tspan><tspan[^>]*> )[^<]+(<\/tspan>)/\1Dropit\2/' dark_mode.svg
          sed -i -E 's/(Top repo: <\/tspan><tspan[^>]*>[^<]*<\/tspan><tspan[^>]*> )[^<]+(<\/tspan>)/\1Dropit\2/' light_mode.svg
          
          # Calculate Uptime from DOB and Override
          UPTIME=$(python3 -c "
          import datetime, calendar
          dob = datetime.date(2007, 6, 20)
          now = datetime.date.today()
          y = now.year - dob.year
          m = now.month - dob.month
          d = now.day - dob.day
          if d < 0:
              m -= 1
              p_m = (now.month - 2) % 12 + 1
              p_y = now.year if p_m != 12 else now.year - 1
              d += calendar.monthrange(p_y, p_m)[1]
          if m < 0:
              y -= 1
              m += 12
          pts = []
          if y > 0: pts.append(f\"{y} year{'s' if y > 1 else ''}\")
          if m > 0: pts.append(f\"{m} month{'s' if m > 1 else ''}\")
          if d > 0 or not pts: pts.append(f\"{d} day{'s' if d > 1 else ''}\")
          print(', '.join(pts))
          ")
          
          sed -i -E "s/(Uptime: <\/tspan><tspan[^>]*>[^<]*<\/tspan><tspan[^>]*> )[^<]+(<\/tspan>)/\1$UPTIME\2/" dark_mode.svg
          sed -i -E "s/(Uptime: <\/tspan><tspan[^>]*>[^<]*<\/tspan><tspan[^>]*> )[^<]+(<\/tspan>)/\1$UPTIME\2/" light_mode.svg

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged — nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card"
            git push
          fi
